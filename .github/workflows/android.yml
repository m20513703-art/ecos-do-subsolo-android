name: Build Ecos do Subsolo APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair arquivos do app
        run: unzip -o eco-android-build.zip
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Validar APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E "assets/(index.html|zumbi-realista.png)"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Ecos do Subsolo — demo Android
          body: Demo inicial para Android, em fase de testes.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
